<div class="loading-overlay" role="status" aria-live="polite">
  <div class="loading-overlay__panel fade-in">
    <div class="loading-overlay__ring" aria-hidden="true">
      <mat-spinner diameter="76"/>
      <mat-icon class="loading-overlay__icon">auto_awesome</mat-icon>
    </div>
    <p class="loading-overlay__message">{{ message() }}</p>
    <p class="loading-overlay__hint">{{ hint() }}</p>
  </div>
</div>
