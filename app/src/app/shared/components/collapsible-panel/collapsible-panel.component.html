<aside class="collapsible-panel" role="complementary" [attr.aria-label]="title">
  <div class="collapsible-panel__header">
    @if (icon) {
      <mat-icon class="collapsible-panel__icon" aria-hidden="true">{{ icon }}</mat-icon>
    }
    <span class="collapsible-panel__title">{{ title }}</span>
  </div>
  <div class="collapsible-panel__content">
    <ng-content></ng-content>
  </div>
</aside>
