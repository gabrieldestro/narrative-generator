<mat-toolbar role="banner">
  <button mat-icon-button (click)="goBack()" aria-label="Voltar" [disabled]="isCreating()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span class="page-title">Cenário Personalizado</span>
</mat-toolbar>

<div class="custom-page__content">
  <ng-custom-scenario [baseTemplate]="baseTemplate()" (createCustom)="onCreateCustom($event)" (cancelCustom)="goBack()"/>
</div>

@if (isCreating()) {
  <ng-loading-overlay/>
}
