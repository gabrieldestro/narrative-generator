<div class="enrich-actions">
  <button
    mat-icon-button
    matTooltip="Enriquecer com IA"
    class="enrich-btn"
    (click)="onEnrich()"
    [disabled]="loading() || summarizing()"
    [attr.aria-label]="'Enriquecer campo ' + field">
    @if (loading()) {
      <mat-progress-spinner diameter="18" mode="indeterminate"></mat-progress-spinner>
    } @else {
      <mat-icon>auto_awesome</mat-icon>
    }
  </button>
  <button
    mat-icon-button
    matTooltip="Resumir com IA"
    class="enrich-btn enrich-btn--summarize"
    (click)="onSummarize()"
    [disabled]="!canSummarize"
    [attr.aria-label]="'Resumir campo ' + field">
    @if (summarizing()) {
      <mat-progress-spinner diameter="18" mode="indeterminate"></mat-progress-spinner>
    } @else {
      <mat-icon>compress</mat-icon>
    }
  </button>
</div>
