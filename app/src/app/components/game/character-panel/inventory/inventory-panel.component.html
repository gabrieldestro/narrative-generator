<div class="inventory-panel">
  <h4 class="section-title">INVENTÁRIO</h4>
  @if (items.length === 0) {
    <p class="inventory-panel__empty">Sem itens</p>
  } @else {
    <ul class="inventory-panel__list">
      @for (item of items; track item) {
        <li class="inventory-panel__item">{{ item }}</li>
      }
    </ul>
  }
</div>
