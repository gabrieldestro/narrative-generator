<div class="action-input" role="form" aria-label="Input de ação do jogador">
  <div class="action-input__selectors">
    <ng-action-type-selector (typeChange)="actionType.set($event)" [disabled]="gameState.isLoading()"/>
    <ng-action-intent-selector (intentChange)="actionIntent.set($event)" [disabled]="gameState.isLoading()"/>
  </div>

  <ng-action-text-input [text]="playerText()" (textChange)="playerText.set($event)" [disabled]="gameState.isLoading()"/>

  <div class="action-input__actions">
    @if (gameState.isLoading()) {
      <button mat-raised-button class="btn-action btn-action--loading" disabled aria-label="Aguardando processamento">
        <mat-spinner diameter="20" aria-hidden="true"/>
        Aguardando...
      </button>
    } @else {
      <button
        mat-stroked-button
        class="btn-action btn-action--observe"
        (click)="observe()"
        [disabled]="!playerText().trim()"
        aria-label="Observar e detalhar a cena">
        <mat-icon>visibility</mat-icon>
        Observar
      </button>
      <button
        mat-stroked-button
        class="btn-action btn-action--narrate"
        (click)="narrate()"
        [disabled]="!playerText().trim()"
        aria-label="Narrar a declaração do jogador">
        <mat-icon>auto_stories</mat-icon>
        Narrar
      </button>
      <button
        mat-raised-button
        class="btn-action"
        (click)="submit()"
        [disabled]="!playerText().trim()"
        aria-label="Enviar ação">
        <mat-icon>bolt</mat-icon>
        Agir
      </button>
    }
  </div>
</div>
