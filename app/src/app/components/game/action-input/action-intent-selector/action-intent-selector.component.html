<mat-form-field appearance="outline" subscriptSizing="dynamic" class="action-select">
  <mat-label>Intenção</mat-label>
  <mat-select [value]="value" (valueChange)="onChange($event)" [disabled]="disabled">
    @for (opt of options; track opt.value) {
      <mat-option [value]="opt.value">
        {{ opt.label }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
