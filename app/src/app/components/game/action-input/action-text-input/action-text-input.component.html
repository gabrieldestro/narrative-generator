<mat-form-field appearance="outline" class="action-text-input">
  <mat-label>O que você faz?</mat-label>
  <textarea
    matInput
    [ngModel]="text()"
    (ngModelChange)="text.set($event)"
    rows="2"
    placeholder="Descreva sua ação..."
    [disabled]="disabled"
  ></textarea>
</mat-form-field>
